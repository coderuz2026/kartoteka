<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Движение по складу — Картотека</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#F7F4EE;color:#1B1F2A}
h1,h2,h3{margin:0}
a{color:#E2762B;text-decoration:none}
.mono{font-family:'IBM Plex Mono',monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea{font-family:inherit;font-size:14px;color:#1B1F2A}

.icon-btn{width:34px;height:34px;border-radius:9px;background:#F3EFE6;display:flex;align-items:center;justify-content:center;color:#4B4F5B}
.icon-btn:hover{background:#EAE4D6}
.btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;background:#E2762B;color:#FFFFFF;border-radius:10px;padding:13px 18px;font-size:14px;font-weight:600;flex-grow:1}
.btn-primary:hover{background:#C7631E}
.btn-secondary{display:flex;align-items:center;justify-content:center;background:#FFFFFF;border:1px solid #E7E2D8;color:#1B1F2A;border-radius:10px;padding:13px 18px;font-size:14px;font-weight:600}
.btn-secondary:hover{background:#F1EEE6}

.toggle{display:flex;background:#F3EFE6;border-radius:11px;padding:4px}
.toggle-opt{flex:1;text-align:center;padding:10px;border-radius:8px;font-size:13.5px;font-weight:600;color:#6B7280}
.toggle-opt-active{background:#1B1F2A;color:#FBF9F4}

.field{display:flex;flex-direction:column;gap:7px}
.field-label{font-size:12.5px;font-weight:600;color:#4B4F5B}
.input{border:1px solid #E7E2D8;border-radius:10px;padding:12px 14px;font-size:14px;background:#FBFAF6;box-sizing:border-box;width:100%}
.input::placeholder{color:#ACA79A}

.stepper{display:flex;align-items:center;border:1px solid #E7E2D8;border-radius:10px;overflow:hidden;background:#FBFAF6;width:fit-content}
.stepper button{width:40px;height:44px;font-size:18px;color:#4B4F5B}
.stepper button:hover{background:#F1EEE6}
.stepper .val{width:56px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600}

.chip{width:30px;height:30px;border-radius:8px;flex-shrink:0}
</style>
</helmet>

<div style="width:720px;height:840px;background:#1B1F2ACC;display:flex;align-items:center;justify-content:center;box-sizing:border-box">
  <div style="width:620px;height:788px;background:#FFFFFF;border-radius:20px;box-shadow:0 20px 50px rgba(20,22,43,0.35);box-sizing:border-box;padding:30px 34px;display:flex;flex-direction:column">

    <div style="display:flex;align-items:center;justify-content:space-between">
      <div>
        <h1 style="font-family:'Fraunces',serif;font-size:21px;font-weight:600">Движение по складу</h1>
        <p style="margin:4px 0 0;font-size:13px;color:#6B7280">Зафиксируйте поступление или списание картриджа</p>
      </div>
      <a href="Inventory.dc.html" class="icon-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </a>
    </div>

    <div class="toggle" style="margin-top:22px">
      <div class="toggle-opt toggle-opt-active">Поступление</div>
      <div class="toggle-opt">Списание</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:18px;margin-top:22px;flex-grow:1">

      <div class="field">
        <span class="field-label">Картридж</span>
        <div class="input" style="display:flex;align-items:center;gap:10px">
          <div class="chip" style="background:#C43B7D"></div>
          <div style="flex-grow:1">
            <div style="font-size:13.5px;font-weight:600">Epson 664 Magenta</div>
            <div class="mono" style="font-size:11.5px;color:#9CA0AE">T66434A · Epson L132/L220</div>
          </div>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#9CA0AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 9 5 5 5-5"/></svg>
        </div>
      </div>

      <div style="display:flex;gap:16px">
        <div class="field" style="flex-grow:0">
          <span class="field-label">Количество</span>
          <div class="stepper">
            <button>−</button>
            <span class="val">10</span>
            <button>+</button>
          </div>
        </div>
        <div class="field" style="flex-grow:1">
          <span class="field-label">Дата</span>
          <input class="input" value="26.09.2026">
        </div>
      </div>

      <div style="display:flex;gap:16px">
        <div class="field" style="flex-grow:1">
          <span class="field-label">Поставщик</span>
          <div class="input" style="display:flex;align-items:center;justify-content:space-between">
            <span>ИнкЛаб</span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#9CA0AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 9 5 5 5-5"/></svg>
          </div>
        </div>
        <div class="field" style="flex-grow:1">
          <span class="field-label">№ накладной</span>
          <input class="input" placeholder="№ 4522">
        </div>
      </div>

      <div class="field">
        <span class="field-label">Комментарий</span>
        <textarea class="input" rows="3" placeholder="Необязательно — например, состояние упаковки или причина корректировки"></textarea>
      </div>

      <div class="field" style="background:#FBF3E9;border:1px solid #F0DCB8;border-radius:10px;padding:12px 14px;flex-direction:row;align-items:center;gap:10px">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#8F5C0C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.9 18a2 2 0 0 0 1.7 3h16.8a2 2 0 0 0 1.7-3L14.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
        <span style="font-size:12.5px;color:#8F5C0C">После сохранения остаток Epson 664 Magenta вырастет с 4 до 14 шт.</span>
      </div>

    </div>

    <div style="display:flex;gap:12px;margin-top:6px">
      <a href="Inventory.dc.html" class="btn-secondary" style="flex:1">Отмена</a>
      <button class="btn-primary" style="flex:2">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        Добавить на склад
      </button>
    </div>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":840}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
