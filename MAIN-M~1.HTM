<html lang="ru">

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#F7F4EE;color:#1B1F2A}
h1,h2,h3{font-family:'Fraunces',serif;margin:0}
a{color:#E2762B;text-decoration:none}
.mono{font-family:'IBM Plex Mono',monospace}
.brand-mark{width:22px;height:22px;border-radius:0 50% 50% 50%;transform:rotate(45deg);background:#E2762B;flex-shrink:0}
.card{background:#FFFFFF;border:1px solid #E7E2D8;border-radius:14px;box-sizing:border-box}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:10.5px;font-weight:600;white-space:nowrap}
.pill-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.pill-critical{background:#F8E4DF;color:#8A2E22}
.pill-critical .pill-dot{background:#B23A2E}
.pill-low{background:#FBEEDA;color:#8F5C0C}
.pill-low .pill-dot{background:#C4841A}
.gauge-track{width:100%;height:6px;border-radius:999px;background:#EEE9DE;overflow:hidden}
.gauge-fill{height:100%;border-radius:999px}
.chip{width:28px;height:28px;border-radius:8px;flex-shrink:0}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:#9CA0AE;font-size:10px;font-weight:600;flex:1}
.tab svg{width:20px;height:20px}
.tab-active{color:#E2762B}
</style>

        <span class="pill pill-critical"><span class="pill-dot"></span>3/5</span>

      <div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F0ECE2">
        <div class="chip" style="background:#C43B7D"></div>
        <div style="flex-grow:1;min-width:0">
          <div style="font-size:12.5px;font-weight:600">Epson 664 Magenta</div>
          <div class="gauge-track" style="margin-top:5px"><div class="gauge-fill" style="width:18%;background:#B23A2E"></div></div>
        </div>
        <span class="pill pill-critical"><span class="pill-dot"></span>4/10</span>
      </div>

      <div style="display:flex;align-items:center;gap:10px;padding:9px 0">
        <div class="chip" style="background:#2A2C33"></div>
        <div style="flex-grow:1;min-width:0">
          <div style="font-size:12.5px;font-weight:600">Canon 725</div>
          <div class="gauge-track" style="margin-top:5px"><div class="gauge-fill" style="width:60%;background:#C4841A"></div></div>
        </div>
        <span class="pill pill-low"><span class="pill-dot"></span>6/8</span>
      </div>
    </div>

  </div>

    <a href="Inventory-Mobile.dc.html" class="tab">
